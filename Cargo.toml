[workspace]

resolver = "3"

members = ["geob", "rusqlite-geob"]

[workspace.dependencies]
rusqlite = { version = "0.37", default-features = false }
geo = { version = "0.32", default-features = false }
rstar = { version = "0.12", default-featuresf = false }
geo-traits = { version = "0.3" }
geo-types = { version = "0.7" }
